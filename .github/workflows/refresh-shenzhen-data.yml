name: Refresh Shenzhen aircraft data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shenzhen-aircraft-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
      - name: Checkout live data branch
        uses: actions/checkout@v4
        with:
          ref: live-data
          path: live-data
      - name: Fetch Shenzhen aircraft
        run: node source/scripts/fetch-shenzhen-aircraft.mjs live-data/shenzhen.json
      - name: Publish snapshot
        working-directory: live-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shenzhen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Shenzhen aircraft snapshot"
          git push
